
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NeGram — восстановление аккаунта</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101116;
      color: white;
      font-family: Arial, sans-serif;
    }
    main {
      width: min(85%, 360px);
      padding: 25px;
      border-radius: 20px;
      background: #202129;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border: 1px solid #444;
      border-radius: 10px;
      background: #30313b;
      color: white;
      font-size: 15px;
    }
    button {
      background: #7777ee;
      border: 0;
      font-weight: bold;
    }
    #status { overflow-wrap: anywhere; }
  </style>
</head>
<body>
<main>
  <h2>NeGram</h2>
  <p>Восстановление аккаунта разработчика</p>

  <form id="recoveryForm">
    <input id="username" placeholder="Твой никнейм" required>
    <input id="password" type="password"
      placeholder="Новый пароль (10–128 символов)"
      minlength="10" maxlength="128" required>
    <input id="secret" type="password"
      placeholder="RESET_SECRET" required>
    <button type="submit">Восстановить доступ</button>
  </form>

  <p id="status"></p>
</main>

<script>
const form = document.getElementById("recoveryForm");
const status = document.getElementById("status");

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const username = document.getElementById("username").value.trim();
  const newPassword = document.getElementById("password").value;
  const resetSecret = document.getElementById("secret").value;

  status.textContent = "Выполняется восстановление...";

  try {
    const response = await fetch(
      "https://negram-messages.cameraz-09165.workers.dev/admin-reset",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username,
          newPassword,
          resetSecret
        })
      }
    );

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error || "Ошибка восстановления");
    }

    status.textContent = "Пароль успешно изменён! Теперь можно войти в NeGram.";
    form.reset();
  } catch (error) {
    status.textContent = "Ошибка: " + error.message;
  }
});
</script>
</body>
</html>
